<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My E-commerce Shop</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
            <a href="checkout.html">Checkout</a>
        </nav>
    </header>

    <main>
        <h1>Welcome to My E-commerce Shop</h1>
        <div class="product-list">
            
            <div class="product-item">
                <img src="assets/images/product1.jpg" alt="Product 1">
                <h2>Product 1</h2>
                <p>$20.00</p>
                <button class="add-to-cart" data-product-id="1" data-name="Product 1" data-price="20.00">Add to Cart</button>
            </div>
           
            <div class="product-item">
                <img src="assets/images/product2.jpg" alt="Product 2">
                <h2>Product 2</h2>
                <p>$30.00</p>
                <button class="add-to-cart" data-product-id="2" data-name="Product 2" data-price="30.00">Add to Cart</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 My E-commerce Shop</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
